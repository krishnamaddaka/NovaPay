apiVersion: apps/v1
kind: Deployment
metadata:
  name: novapay-deployment
  labels:
    app: novapay
spec:
  replicas: 3
  selector:
    matchLabels:
      app: novapay  
  template:
    metadata:
      labels:
        app: novapay
    spec:
      containers:
      - name: novapay
        image: novapay:latest
        ports:
        - containerPort: 80
