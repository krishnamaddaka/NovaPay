apiVersion: apps/v1
kind: Deployment
metadata:
  name: novapay-deployment
spec:
  replicas: 2

  selector:
    matchLabels:
      app: novapay

  template:
    metadata:
      labels:
        app: novapay

    spec:
      containers:
        - name: novapay
          image: mvp9676/novapay:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/novapay"

            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"

            - name: SPRING_DATASOURCE_PASSWORD
              value: "postgres"

---
apiVersion: v1
kind: Service
metadata:
  name: novapay-service
spec:
  selector:
    app: novapay

  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080

  type: LoadBalancer