apiVersion: apps/v1
kind: Deployment
metadata:
  name: novapay-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: novapay
  template:
    metadata:
      labels:
        app: novapay
    spec:
      containers:
        - name: novapay
          image: ${{ secrets.DOCKER_ID }}/novapay:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: novapay-service
spec:
  selector:
    app: novapay
  ports:
    - port: 80
      targetPort: 8080
  type: LoadBalancer