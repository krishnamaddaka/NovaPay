spring:
  application:
    name: NovaPay
  datasource:
    url: jdbc:postgresql://localhost:5432/novapay
    username: postgres
    password: Postgresql
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  