name: NovaPay
on:
  push:
    branches:
      - main
jobs:
    build-deploy:
        runs-on: ubuntu-latest
        steps: 
            - name: Checkout code
              uses: actions/checkout@v3
            - name: setup java
              uses: actions/setup-java@v5
              with:
                distribution: temurin
                java-version: '25'
            - name: Package application
              run: mvn clean package -DskipTests
            - name: build docker image
              run: docker build -t novapay:v1 .