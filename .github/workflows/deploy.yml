name: NovaPay
on:
  push:
    branches:
      - main
jobs:
    build:
        runs-on: ubuntu-latest
        steps: 
            - name: Checkout code
              uses: actions/checkout@v3
            - name: setup java
              uses: actions/setup-java@v5
              with:
                distribution: temurin
                java-version: '25'
            - name: Package application
              run: mvn clean package -DskipTests
            - name: Upload JAR
              uses: actions/upload-artifact@v4
              with:
                name: novapay-jar
                path: target/NovaPay-0.0.1-SNAPSHOT.jar
    docker:
      runs-on: ubuntu-latest
      needs: build
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
        - name: Download JAR
          uses: actions/download-artifact@v4
          with:
            name: novapay-jar
            path: target
        - name: login to docker hub
          uses: docker/login-action@v2
          with:
              username: ${{ secrets.DOCKER_ID }}
              password: ${{ secrets.DOCKER_PASS }}
        - name: build docker image
          run: docker build -t ${{ secrets.DOCKER_ID }}/novapay:${{ github.sha }} .
        - name: Push image
          run: docker push ${{ secrets.DOCKER_ID }}/novapay:${{ github.sha }}
    deploy:
      runs-on: ubuntu-latest
      needs: docker
      env:
        KUBECONFIG: ${{ github.workspace }}/kubeconfig.yaml

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up kubectl
          uses: azure/setup-kubectl@v4
          with:
            version: latest

        - name: Set up Kubeconfig
          run: |
            echo "${{ secrets.KUBECONFIG }}" > "$KUBECONFIG"
            chmod 600 "$KUBECONFIG"

        - name: Test Kubernetes connection
          run: |
            kubectl cluster-info
            kubectl get nodes

        - name: Apply Kubernetes deployment
          run: |
            kubectl apply -f k8/deployment.yaml

        - name: Update deployment image
          run: |
            kubectl set image deployment/novapay-deployment \
              novapay=${{ secrets.DOCKER_ID }}/novapay:${{ github.sha }}

        - name: Verify rollout status
          run: |
            kubectl rollout status deployment/novapay-deployment