name: NovaPay

on:
  push:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Package application
        run: mvn clean package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: novapay-jar
          path: target/NovaPay-0.0.1-SNAPSHOT.jar


  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: novapay-jar
          path: target

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_ID }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_ID }}/novapay:${{ github.sha }} \
            -t ${{ secrets.DOCKER_ID }}/novapay:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_ID }}/novapay:${{ github.sha }}
          docker push ${{ secrets.DOCKER_ID }}/novapay:latest